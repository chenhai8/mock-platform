# 供现有 Nginx 站点 server 内合并的 location 片段，不是完整 nginx.conf
# Compose 不部署 Nginx，也不会加载此文件，不要覆盖服务器现有主配置
# 同机代理使用 127.0.0.1:16080；远程代理替换为业务宿主机内网 IP 和 APP_PORT
# 管理访问控制、域名与 TLS 沿用已有站点策略；只开放 Mock 时使用 location /m/
location / {
    proxy_pass http://127.0.0.1:16080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 5m;
    proxy_read_timeout 25s;
}
